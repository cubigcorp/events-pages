# PR마다: ① 자동 정리(tools/autofix_pages.py — 머리·공통 틀·측정·데이터 연결만, 본문 디자인은 그대로)를 PR 브랜치에 커밋
#         ② 페이지 규칙 검사(tools/check_pages.py, 로컬 검사와 같음) ③ 고친 것·남은 경고를 PR 댓글 하나로 알림.
# 댓글(=작성자 메일)은 자동으로 고쳤거나 오류·경고가 있을 때만 새로 답니다. 다 통과면 기존 댓글만 '통과'로 고칩니다(수정은 메일 안 감).
# PR 본문에 '공통 파일 변경'을 확인했다고 적으면(템플릿 체크박스 [x]) 그 경고는 참고(ℹ)로 내려갑니다. 본문을 고치면 다시 검사합니다.
# main은 사람이 합칩니다. 다른 저장소(포크)에서 온 PR은 쓰기 권한이 없어 검사만 합니다.
name: Page check
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  checks: write
concurrency:
  group: page-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Page check
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: 도구 준비
        run: pip install --quiet pillow beautifulsoup4

      - name: 자동 정리 (같은 저장소 PR만)
        id: fix
        if: env.SAME_REPO == 'true'
        run: |
          python3 tools/autofix_pages.py --report /tmp/fix.md
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "자동 정리: 머리·공통 틀·측정·검색 정보 (tools/autofix_pages.py)"
            git push -q origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 페이지 검사
        id: check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          # PR 본문에서 공통 파일 변경 확인 표시 찾기: '## 공통 파일 변경' 절 안의 체크박스 [x] 아무거나,
          # 또는 그 제목 줄 밖에 적은 '공통 파일 변경'
          if printf '%s' "$PR_BODY" | awk '/^##/{s=($0 ~ /공통 파일 변경/)} s && /^[[:space:]]*- \[[xX]\]/{f=1} END{exit !f}' \
             || printf '%s' "$PR_BODY" | grep -v '^## 공통 파일 변경' | grep -q '공통 파일 변경'; then
            export COMMON_ACK=1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin "${{ github.base_ref }}"
            python3 tools/check_pages.py --base "origin/${{ github.base_ref }}" > /tmp/check.txt 2>&1
          else
            python3 tools/check_pages.py > /tmp/check.txt 2>&1
          fi
          code=$?
          cat /tmp/check.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "issues=$(grep -cE '^(✖|⚠) ' /tmp/check.txt)" >> "$GITHUB_OUTPUT"

      # 봇이 올린 커밋에는 검사가 다시 돌지 않으므로, 같은 결과를 그 커밋에 'Page check'로 붙입니다(main 합치기 조건).
      - name: 자동 정리 커밋에 검사 결과 붙이기
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          concl=$([ "${{ steps.check.outputs.code }}" = "0" ] && echo success || echo failure)
          tail -c 60000 /tmp/check.txt > /tmp/check-tail.txt
          jq -n --arg sha "${{ steps.fix.outputs.sha }}" --arg c "$concl" --rawfile t /tmp/check-tail.txt \
            '{name:"Page check", head_sha:$sha, status:"completed", conclusion:$c, output:{title:"Page check", summary:"자동 정리 뒤 검사 결과", text:$t}}' \
            | gh api repos/${{ github.repository }}/check-runs --input - > /dev/null

      - name: PR 댓글 (하나만 두고 갱신, 알릴 것 있을 때만 새로)
        if: env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- page-check -->")) | .id' | head -1)
          if [ "${{ steps.fix.outputs.changed }}" != "true" ] && [ "${{ steps.check.outputs.issues }}" = "0" ]; then
            # 알릴 것 없음: 새 댓글(메일)은 안 달고, 예전 댓글이 있으면 '통과'로만 고침
            if [ -n "$id" ]; then
              printf '<!-- page-check -->\n### 페이지 자동 정리·검사\n\n✅ 모두 통과 (고칠 것·경고 없음)\n' > /tmp/comment.md
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@/tmp/comment.md > /dev/null
            fi
            exit 0
          fi
          {
            echo "<!-- page-check -->"
            echo "### 페이지 자동 정리·검사"
            echo
            if [ "${{ steps.fix.outputs.changed }}" = "true" ]; then
              echo "**자동으로 고쳐서 이 PR에 커밋했습니다** (본문 디자인·문구는 그대로). 로컬에서 이어 작업하면 먼저 \`git pull\` 해 주세요."
              echo
              cat /tmp/fix.md
            else
              echo "자동으로 고칠 것 없음."
            fi
            echo
            echo "**검사 결과** (✖ 오류는 고쳐야 합칠 수 있음 · ⚠ 경고는 사람이 판단)"
            echo
            echo '```'
            grep -v '^::' /tmp/check.txt | tail -c 50000
            echo '```'
          } > /tmp/comment.md
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@/tmp/comment.md > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@/tmp/comment.md > /dev/null
          fi

      - name: 검사 결과
        run: exit ${{ steps.check.outputs.code }}
