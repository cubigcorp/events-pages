<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- ① 검색 노출: 기본은 검색 제외. 노출하려면 PR에 요청(마케팅 검토 후 이 줄 삭제) -->
<meta name="robots" content="noindex">

<!-- ② 브라우저 탭·검색 결과 제목 (60자 이내) -->
<title>Event title | CUBIG</title>

<!-- ③ 검색 결과·공유 미리보기 설명 (160자 이내) -->
<meta name="description" content="One or two sentences about this event.">

<!-- ④ 공유 미리보기(링크드인·슬랙 등). 폴더이름·이미지 파일명을 바꿔 주세요 -->
<meta property="og:title" content="Event title | CUBIG">
<meta property="og:description" content="One or two sentences about this event.">
<meta property="og:image" content="https://events.cubig.ai/folder-name/og.png">
<meta property="og:url" content="https://events.cubig.ai/folder-name/">
<link rel="canonical" href="https://events.cubig.ai/folder-name/">

<!-- ⑤ 추적 코드 자리: 마케팅팀이 넣습니다. 직접 추가·삭제하지 마세요 -->

<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#111;background:#fff;line-height:1.6}
  main{max-width:960px;margin:0 auto;padding:64px 24px}
  h1{font-size:40px;line-height:1.2;margin:0 0 16px}
  a.button{display:inline-block;padding:12px 24px;border-radius:8px;background:#111;color:#fff;text-decoration:none}
</style>
</head>
<body>
<main>
  <!-- ⑥ 본문: 여기부터 자유롭게 -->
  <h1>Event title</h1>
  <p>Date · Location</p>
  <p><a class="button" href="https://cubig.ai">Learn more</a></p>
</main>
</body>
</html>
